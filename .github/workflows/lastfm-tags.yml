name: Kuenstler-Stil-Tags (Last.fm)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Datum des Pools"
        default: "2026-11-06"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Abfragen
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          python3 scripts/lastfm_tags.py "data/pools/pool_tracks_${{ github.event.inputs.date }}.csv" "data/analysis/lastfm_tags.csv" | tee run.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < run.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis/lastfm_tags.csv
          git commit -m "Last.fm tags" || true
          git pull --rebase origin main && git push origin HEAD:main
