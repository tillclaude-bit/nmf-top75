name: Kuenstler-Genres (Spotify)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Datum der NMF-Woche"
        default: "2026-10-30"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 scripts/artist_genres.py "${{ github.event.inputs.date }}" "data/analysis/artist_genres_${{ github.event.inputs.date }}.csv" | tee run.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < run.txt
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis
          git commit -m "Add artist genres ${{ github.event.inputs.date }}" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
