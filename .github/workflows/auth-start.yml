name: Spotify-Freigabe Schritt 1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link erzeugen
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          python3 scripts/auth_start.py | tee out.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < out.txt
      - name: Verifier speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f auth/pkce.json
          git commit -m "auth: pkce verifier" || true
          git pull --rebase origin main
          git push origin HEAD:main
