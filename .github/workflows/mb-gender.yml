name: Kuenstler-Geschlecht (MusicBrainz)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Abfragen
        run: |
          python3 scripts/mb_gender.py data/analysis/mb_gender.csv | tee run.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < run.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis/mb_gender.csv
          git commit -m "MusicBrainz gender" || true
          git pull --rebase origin main && git push origin HEAD:main
