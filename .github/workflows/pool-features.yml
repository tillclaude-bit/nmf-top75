name: Pool holen und Vorschau-Features berechnen

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Datum der NMF-Woche (JJJJ-MM-TT)"
        default: "2026-10-30"
      dataset:
        description: "Vorhandenes Apify-Dataset nutzen (leer = Scraper neu starten, ca. 3 Cent)"
        default: "AhDPTdO5nCOAk7rsR"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install -q librosa pyloudnorm numpy scipy
      - name: Fetch pool
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.dataset }}" ]; then
            python3 scripts/fetch_pool.py "${{ github.event.inputs.date }}" --dataset "${{ github.event.inputs.dataset }}" | tee fetch.txt
          else
            python3 scripts/fetch_pool.py "${{ github.event.inputs.date }}" | tee fetch.txt
          fi
          while IFS= read -r line; do echo "::notice::${line}"; done < fetch.txt
      - name: Commit pool archive
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/pools
          git commit -m "Archive pool ${{ github.event.inputs.date }}" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Compute preview descriptors
        run: |
          python3 scripts/preview_features.py "data/pools/pool_descriptors_${{ github.event.inputs.date }}.csv" --pool "data/pools/pool_tracks_${{ github.event.inputs.date }}.csv" | tee run.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < run.txt
      - name: Commit descriptors
        run: |
          git add data/pools
          git commit -m "Add pool descriptors ${{ github.event.inputs.date }}" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
