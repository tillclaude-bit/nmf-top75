name: Woechentliche Top 75

on:
  schedule:
    - cron: "17 3 * * 5"   # freitags 03:17 UTC (= 04:17/05:17 Uhr deutscher Zeit)
  workflow_dispatch:
    inputs:
      date:
        description: "Datum (leer = heute, UTC)"
        default: ""
      skip_playlist:
        description: "ja = keine Playlist anlegen (Probelauf)"
        default: "nein"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Datum bestimmen
        run: |
          D="${{ github.event.inputs.date }}"
          [ -z "$D" ] && D=$(date -u +%F)
          echo "DATE=$D" >> "$GITHUB_ENV"
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install -q librosa pyloudnorm numpy scipy pandas scikit-learn
      - name: Pool holen (14 NMF-Playlists)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 scripts/fetch_pool.py "$DATE" | tee fetch.txt
      - name: Pool archivieren
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/pools
          git commit -m "Archive pool $DATE" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Klang-Eigenschaften berechnen
        run: python3 scripts/preview_features.py "data/pools/pool_descriptors_$DATE.csv" --pool "data/pools/pool_tracks_$DATE.csv" | tee desc.txt
      - name: Bewerten und Top 75 waehlen
        run: python3 scripts/score_pool.py "$DATE" | tee score.txt
      - name: Ergebnis archivieren
        run: |
          git add data/pools data/rankings
          git commit -m "Ranking and playlist $DATE" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Playlist anlegen
        if: github.event.inputs.skip_playlist != 'ja'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python3 scripts/create_playlist.py "$DATE" | tee pl.txt
      - name: Zusammenfassung
        if: always()
        run: |
          for f in fetch.txt desc.txt score.txt pl.txt; do
            if [ -f "$f" ]; then grep -v '^ *[0-9]* ' "$f" | while IFS= read -r line; do echo "::notice::${line}"; done || true; fi
          done
          exit 0
