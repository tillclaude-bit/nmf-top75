name: Woechentliche Top 75

on:
  schedule:
    - cron: "17 3 * * 5"   # freitags 03:17 UTC (= 04:17/05:17 Uhr deutscher Zeit)
  workflow_dispatch:
    inputs:
      date:
        description: "Datum (leer = heute, UTC)"
        default: ""
      skip_playlist:
        description: "ja = keine Playlist anlegen (Probelauf)"
        default: "nein"
      dataset:
        description: "Nur Test: vorhandenes Apify-Dataset nutzen (kostenlos, ohne Frische-Pruefung)"
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Datum bestimmen
        run: |
          D="${{ github.event.inputs.date }}"
          [ -z "$D" ] && D=$(date -u +%F)
          echo "DATE=$D" >> "$GITHUB_ENV"
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install -q librosa pyloudnorm numpy scipy pandas scikit-learn faster-whisper
      - name: Feedback der Vorwoche einlesen (deine Aenderungen an der letzten Playlist)
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 scripts/ingest_feedback.py | tee fb.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/feedback data/feedback.csv
          git commit -m "Ingest feedback from last playlist" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Pool holen (14 NMF-Playlists)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.dataset }}" ]; then
            python3 scripts/fetch_pool.py "$DATE" --dataset "${{ github.event.inputs.dataset }}" | tee fetch.txt
            exit 0
          fi
          for try in 1 2 3 4; do
            python3 scripts/fetch_pool.py "$DATE" | tee fetch.txt
            if python3 scripts/check_fresh.py "$DATE" | tee -a fetch.txt; then break; fi
            if [ "$try" = 4 ]; then echo "Warnung: Playlists evtl. noch nicht aktualisiert, mache trotzdem weiter" | tee -a fetch.txt; break; fi
            echo "Warte 30 Minuten auf neue Playlists (Versuch $try)" | tee -a fetch.txt
            sleep 1800
          done
      - name: Pool archivieren
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/pools
          git commit -m "Archive pool $DATE" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Klang-Eigenschaften berechnen
        run: python3 scripts/preview_features.py "data/pools/pool_descriptors_$DATE.csv" --pool "data/pools/pool_tracks_$DATE.csv" | tee desc.txt
      - name: Sprache der Songs erkennen
        run: python3 scripts/language_id.py "data/analysis/language_$DATE.csv" "data/pools/pool_tracks_$DATE.csv" | tee lang.txt
      - name: Stil-Tags der Kuenstler holen (MusicBrainz, nur neue Kuenstler)
        continue-on-error: true
        timeout-minutes: 40
        run: python3 scripts/mb_tags.py "data/pools/pool_tracks_$DATE.csv" data/analysis/mb_tags.csv | tee mb.txt
      - name: Bewerten und Top 75 waehlen
        run: python3 scripts/score_pool.py "$DATE" | tee score.txt
      - name: Ergebnis archivieren
        run: |
          git add data/pools data/rankings data/analysis
          git commit -m "Ranking and playlist $DATE" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Playlist anlegen
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_playlist == 'nein'  # Zeitplanlauf legt keine Playlist an: erst Recherche, dann finalize-top75.yml
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python3 scripts/create_playlist.py "$DATE" | tee pl.txt
      - name: Playlist-ID festhalten
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_playlist == 'nein'  # Zeitplanlauf legt keine Playlist an: erst Recherche, dann finalize-top75.yml
        run: |
          git add data/playlist_ids.csv
          git commit -m "Record playlist id $DATE" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Zusammenfassung
        if: always()
        run: |
          for f in fb.txt fetch.txt desc.txt lang.txt score.txt pl.txt; do
            if [ -f "$f" ]; then grep -v '^ *[0-9]* ' "$f" | while IFS= read -r line; do echo "::notice::${line}"; done || true; fi
          done
          exit 0
