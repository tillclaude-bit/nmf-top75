name: Woechentlicher Pool (nur Pool + Pool-Playlist, keine Top 75)

on:
  schedule:
    - cron: "30 5 * * 5"   # 05:30 UTC = 07:30 Berlin im Sommer (MESZ)
    - cron: "30 6 * * 5"   # 06:30 UTC = 07:30 Berlin im Winter (MEZ); das Gate laesst nur den passenden Lauf durch
  workflow_dispatch:
    inputs:
      date:
        description: "Datum (leer = heute, UTC)"
        default: ""
      skip_playlist:
        description: "ja = keine Playlist anlegen (Probelauf)"
        default: "nein"
      dataset:
        description: "Nur Test: vorhandenes Apify-Dataset nutzen (kostenlos, ohne Frische-Pruefung)"
        default: ""

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          H=$(TZ=Europe/Berlin date +%H)
          D=$(date -u +%F)
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          elif grep -q "^$D," data/pool_playlist_ids.csv; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "Pool-Playlist fuer $D gibt es schon (von Hand angelegt), Zeitplanlauf entfaellt"
          elif [ "$H" = "07" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Berlin-Stunde $H, kein 07:30-Lauf"; fi
  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Datum bestimmen
        run: |
          D="${{ github.event.inputs.date }}"
          [ -z "$D" ] && D=$(date -u +%F)
          echo "DATE=$D" >> "$GITHUB_ENV"
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install -q librosa pyloudnorm numpy scipy pandas scikit-learn faster-whisper
      - name: Feedback der Vorwoche einlesen (deine Aenderungen an der letzten Playlist)
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 scripts/ingest_feedback.py | tee fb.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/feedback data/feedback.csv
          git commit -m "Ingest feedback from last playlist" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Pool holen (14 NMF-Playlists)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.dataset }}" ]; then
            python3 scripts/fetch_pool.py "$DATE" --dataset "${{ github.event.inputs.dataset }}" | tee fetch.txt
            exit 0
          fi
          for try in 1 2 3 4; do
            python3 scripts/fetch_pool.py "$DATE" | tee fetch.txt
            if python3 scripts/check_fresh.py "$DATE" | tee -a fetch.txt; then break; fi
            if [ "$try" = 4 ]; then echo "Warnung: Playlists evtl. noch nicht aktualisiert, mache trotzdem weiter" | tee -a fetch.txt; break; fi
            echo "Warte 30 Minuten auf neue Playlists (Versuch $try)" | tee -a fetch.txt
            sleep 1800
          done
      - name: Pool archivieren
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/pools
          git commit -m "Archive pool $DATE" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Pool-Playlist anlegen (alle Songs der Woche, zum Export mit Exportify)
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 scripts/create_pool_playlist.py "$DATE" | tee poolpl.txt
          git add data/pool_playlist_ids.csv
          git commit -m "Pool playlist id $DATE" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Sprache der Songs erkennen
        run: python3 scripts/language_id.py "data/analysis/language_$DATE.csv" "data/pools/pool_tracks_$DATE.csv" | tee lang.txt
      - name: Stil-Tags der Kuenstler holen (MusicBrainz, nur neue Kuenstler)
        continue-on-error: true
        timeout-minutes: 40
        run: python3 scripts/mb_tags.py "data/pools/pool_tracks_$DATE.csv" data/analysis/mb_tags.csv | tee mb.txt
      - name: Stil-Tags der Kuenstler holen (Last.fm, nur neue Kuenstler)
        continue-on-error: true
        timeout-minutes: 40
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python3 scripts/lastfm_tags.py "data/pools/pool_tracks_$DATE.csv" data/analysis/lastfm_tags.csv | tee lf.txt
      - name: Geschlecht der Kuenstler holen (MusicBrainz, nur neue Kuenstler)
        continue-on-error: true
        timeout-minutes: 30
        run: python3 scripts/mb_gender.py data/analysis/mb_gender.csv | tee mbg.txt
      - name: Analysen archivieren
        run: |
          git add data/pools data/analysis
          git commit -m "Pool analysis $DATE" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Zusammenfassung
        if: always()
        run: |
          for f in fb.txt fetch.txt lang.txt poolpl.txt; do
            if [ -f "$f" ]; then grep -v '^ *[0-9]* ' "$f" | while IFS= read -r line; do echo "::notice::${line}"; done || true; fi
          done
          exit 0
