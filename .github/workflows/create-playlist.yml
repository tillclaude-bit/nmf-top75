name: Playlist anlegen
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Datum der NMF-Woche"
        default: "2026-10-30"
      suffix:
        description: "Suffix der Ergebnisdatei (z.B. _neu), leer = Standard"
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Playlist anlegen
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 scripts/create_playlist.py "${{ github.event.inputs.date }}" "${{ github.event.inputs.suffix }}" | tee out.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < out.txt
      - name: ID committen
        if: github.event.inputs.suffix != ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/playlist_ids_neu.csv
          git commit -m "Playlist id (neu)" || true
          git pull --rebase origin main && git push origin HEAD:main
