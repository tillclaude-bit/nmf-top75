name: Sprache aus Songtexten (Test)
on:
  workflow_dispatch:
    inputs:
      date:
        default: "2026-10-30"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q langdetect
      - name: Texte holen
        run: |
          python3 scripts/lyrics_lang.py "data/analysis/lyrics_lang_${{ github.event.inputs.date }}.csv" "data/pools/pool_tracks_${{ github.event.inputs.date }}.csv" | tee o.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < o.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis
          git commit -m "Lyrics language test" || true
          git pull --rebase origin main
          git push origin HEAD:main
