name: Feedback einlesen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas
      - name: Einlesen
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 scripts/ingest_feedback.py | tee o.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < o.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/feedback data/feedback.csv
          git commit -m "Ingest feedback" || true
          git pull --rebase origin main
          git push origin HEAD:main
