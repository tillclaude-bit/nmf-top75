name: Sprach-Erkennung (Whisper)
on:
  workflow_dispatch:
    inputs:
      date:
        default: "2026-10-30"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install -q faster-whisper numpy
      - name: Sprache erkennen
        run: |
          python3 scripts/language_id.py "data/analysis/language_${{ github.event.inputs.date }}.csv" "data/pools/pool_tracks_${{ github.event.inputs.date }}.csv" | tee o.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < o.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis
          git commit -m "Add language id ${{ github.event.inputs.date }}" || true
          git pull --rebase origin main
          git push origin HEAD:main
