name: Refresh-Token ablegen
on:
  workflow_dispatch:
    inputs:
      token:
        description: "Refresh-Token"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verschluesseln
        env:
          RT: ${{ github.event.inputs.token }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: bash scripts/token_store.sh
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f auth/refresh_token.enc
          git commit -m "auth: store encrypted refresh token" || true
          git pull --rebase origin main
          git push origin HEAD:main
