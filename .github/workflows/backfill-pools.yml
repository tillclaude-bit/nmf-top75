name: Alte Pools aus Apify-Datasets archivieren
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "DATUM:DATASET, kommagetrennt"
        default: "2026-10-23:0sQXlIR8PTdSkthli,2026-10-16:V3mWshphzu2FfnVan,2026-10-09:QAwN4HEialz08DQar"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Holen
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          for p in $(echo "${{ github.event.inputs.pairs }}" | tr ',' ' '); do
            d=${p%%:*}; ds=${p##*:}
            python3 scripts/fetch_pool.py "$d" --dataset "$ds" 2>&1 | tee -a out.txt || echo "FEHLER $p" | tee -a out.txt
          done
          while IFS= read -r line; do echo "::notice::${line}"; done < out.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/pools
          git commit -m "Backfill older pools" || true
          git pull --rebase origin main
          git push origin HEAD:main
