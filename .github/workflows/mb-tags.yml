name: Kuenstler-Stil-Tags (MusicBrainz)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Datum des Pools"
        default: "2026-11-06"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Abfragen
        run: |
          python3 scripts/mb_tags.py "data/pools/pool_tracks_${{ github.event.inputs.date }}.csv" "data/analysis/mb_tags.csv" | tee run.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < run.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis/mb_tags.csv
          git commit -m "MusicBrainz tags" || true
          git push || true
