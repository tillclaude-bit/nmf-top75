name: Playlist einlesen
on:
  workflow_dispatch:
    inputs:
      playlist:
        description: "Playlist-ID"
        default: "5zRAVj50zwrhrNbSZauaIz"
      out:
        description: "Ausgabedatei"
        default: "data/feedback/user_playlist_2026-10-30_final.csv"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lesen
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 scripts/read_playlist.py "${{ github.event.inputs.playlist }}" "${{ github.event.inputs.out }}" | tee o.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < o.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/feedback
          git commit -m "Read user playlist" || true
          git pull --rebase origin main
          git push origin HEAD:main
