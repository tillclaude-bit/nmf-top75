name: Preview features (Kalibrierung)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nur die ersten N Tracks (0 = alle)"
        default: "0"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install -q librosa pyloudnorm numpy scipy
      - name: Compute preview descriptors
        run: |
          python3 scripts/preview_features.py data/analysis/preview_descriptors_2026-10-30.csv --limit "${{ github.event.inputs.limit }}" | tee run.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < run.txt
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis/preview_descriptors_2026-10-30.csv
          git commit -m "Add preview descriptors (calibration set)" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
