name: Pool-Playlist anlegen
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Datum der NMF-Woche"
        default: "2026-11-06"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pool-Playlist anlegen
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 scripts/create_pool_playlist.py "${{ github.event.inputs.date }}" | tee out.txt
          while IFS= read -r line; do echo "::notice::${line}"; done < out.txt
      - name: ID committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/pool_playlist_ids.csv
          git commit -m "Pool playlist id" || true
          git pull --rebase origin main && git push origin HEAD:main
